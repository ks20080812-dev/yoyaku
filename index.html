<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omori Lab. 予約受付</title>
    <style>
        body {
            font-family: "游明朝", "Yu Mincho", "Hiragino Mincho ProN", serif;
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
            background-color: #0d0d0d;
            color: #d1d1d1;
            line-height: 1.7;
        }
        
        .intro-box {
            background-color: #1a0505;
            border-left: 4px solid #8b0000;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.3);
        }
        
        .intro-box p {
            margin: 0 0 10px 0;
        }
        
        .intro-box p:last-child {
            margin-bottom: 0;
        }

        .highlight-title {
            color: #ff3333;
            font-size: 1.2em;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #8b0000;
        }

            
        /* コンセプトセクションのスタイル */
        .concept-section {
            text-align: center;
            background-color: #140505;
            border: 1px dashed #a00000;
            padding: 20px 15px;
            margin-bottom: 35px;
            border-radius: 6px;
        }

        .concept-text {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1em;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 視認性を上げたコンセプトボタン */
        .btn-concept {
            display: inline-block;
            background: linear-gradient(180deg, #b30000 0%, #660000 100%);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 1.15em;
            letter-spacing: 2px;
            border: 2px solid #ff3333;
            text-shadow: 0 0 5px #000000, 0 0 10px #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            animation: pulse-red 2s infinite;
            transition: all 0.2s ease-in-out;
        }

        /* ホバー時の変化 */
        .btn-concept:hover {
            background: linear-gradient(180deg, #ff1a1a 0%, #990000 100%);
            transform: scale(1.03);
            box-shadow: 0 0 25px #ff0000;
            border-color: #ffffff;
        }

        /* 怪しく点滅するアニメーション */
        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
                border-color: #ff3333;
            }
            50% {
                box-shadow: 0 0 22px rgba(255, 0, 0, 0.95);
                border-color: #ff8888;
            }
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
                border-color: #ff3333;
            }
        }
        
        .date-header {
            font-size: 1.3em;
            font-weight: bold;
            border-bottom: 1px solid #8b0000;
            padding-bottom: 5px;
            margin-top: 40px;
            margin-bottom: 20px;
            color: #ff2222;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }
        
        .slot-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .slot-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            margin-bottom: 12px;
            background-color: #141414;
            border: 1px solid #330000;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .slot-item:hover {
            border-color: #8b0000;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.5);
        }
        
        .time-label {
            font-weight: bold;
            font-size: 1em;
            color: #cccccc;
            letter-spacing: 1px;
        }
        
        .btn-reserve {
            display: inline-block;
            background-color: #5a0000;
            color: #ffcccc;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #8b0000;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.9em;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        
        .btn-reserve:hover {
            background-color: #8b0000;
            color: #ffffff;
            box-shadow: 0 0 10px #ff0000;
        }
    </style>
</head>
<body>

    <div class="intro-box">

        <p>たくさんのかたにお越しいただき、３年６組一同、嬉しい限りです！<br>Omori Labにお越しいただき、ありがとうございました！
            <br><strong class="highlight-title">本日１８時までに、四高祭企画の投票に、ぜひご協力ください！</strong></p></p>
        <p class="concept-text">↓↓↓↓</p>
        <a href="https://forms.gle/1Wk1t9uSmmm9V5866" target="_blank" class="btn-concept">【投票はこちら】</a></p>
    </div>

</body>
</html>
