<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omori Lab. 予約受付</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiYo, sans-serif;
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
            background-color: #0d0d0d;
            color: #d1d1d1;
            line-height: 1.7;
        }
        
        .intro-box {
            background-color: #1a0505;
            border-left: 4px solid #8b0000;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.3);
        }
        
        .intro-box p {
            margin: 0 0 10px 0;
        }
        
        .intro-box p:last-child {
            margin-bottom: 0;
        }

        .highlight-title {
            color: #ff3333;
            font-size: 1.2em;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #8b0000;
        }

            
        /* コンセプトセクションのスタイル */
        .concept-section {
            text-align: center;
            background-color: #140505;
            border: 1px dashed #a00000;
            padding: 20px 15px;
            margin-bottom: 35px;
            border-radius: 6px;
        }

        .concept-text {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1em;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 視認性を上げたコンセプトボタン */
        .btn-concept {
            display: inline-block;
            background: linear-gradient(180deg, #b30000 0%, #660000 100%);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 1.15em;
            letter-spacing: 2px;
            border: 2px solid #ff3333;
            text-shadow: 0 0 5px #000000, 0 0 10px #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            animation: pulse-red 2s infinite;
            transition: all 0.2s ease-in-out;
        }

        /* ホバー時の変化 */
        .btn-concept:hover {
            background: linear-gradient(180deg, #ff1a1a 0%, #990000 100%);
            transform: scale(1.03);
            box-shadow: 0 0 25px #ff0000;
            border-color: #ffffff;
        }

        /* 怪しく点滅するアニメーション */
        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
                border-color: #ff3333;
            }
            50% {
                box-shadow: 0 0 22px rgba(255, 0, 0, 0.95);
                border-color: #ff8888;
            }
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
                border-color: #ff3333;
            }
        }
        
        .date-header {
            font-size: 1.3em;
            font-weight: bold;
            border-bottom: 1px solid #8b0000;
            padding-bottom: 5px;
            margin-top: 40px;
            margin-bottom: 20px;
            color: #ff2222;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        }
        
        .slot-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .slot-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            margin-bottom: 12px;
            background-color: #141414;
            border: 1px solid #330000;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .slot-item:hover {
            border-color: #8b0000;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.5);
        }
        
        .time-label {
            font-weight: bold;
            font-size: 1em;
            color: #cccccc;
            letter-spacing: 1px;
        }
        
        .btn-reserve {
            display: inline-block;
            background-color: #5a0000;
            color: #ffcccc;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #8b0000;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.9em;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        
        .btn-reserve:hover {
            background-color: #8b0000;
            color: #ffffff;
            box-shadow: 0 0 10px #ff0000;
        }
        /* 右上の固定ロゴ */
        .top-logo {
          position: fixed;
          top: 15px;
          right: 20px;
          width: 50px; /* ロゴの大きさ（必要に応じて変更） */           
          height: auto;
          z-index: 1000;
          filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.4));
          transition: transform 0.3s ease, filter 0.3s ease;
        }

        .top-logo:hover {
          transform: scale(1.08);
          filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.8));
        }
        
        /* ロゴをクリック可能に */
.top-logo {
  cursor: pointer;
}

/* フルスクリーンメニュー背景 */
.menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(5, 0, 0, 0.93);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
}

/* メニュー表示時 */
.menu-overlay.active {
  opacity: 1;
  visibility: visible;
}

/* 閉じるボタン (✕) */
.menu-close-btn {
  position: absolute;
  top: 20px;
  right: 25px;
  color: #ff2b2b;
  font-size: 2.2rem;
  cursor: pointer;
  line-height: 1;
  text-shadow: 0 0 10px #ff0000;
  transition: transform 0.3s ease, color 0.3s ease;
}
.menu-close-btn:hover {
  transform: rotate(90deg) scale(1.1);
  color: #ffffff;
}

/* メニューリスト */
.menu-list {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: center;
}

/* 各メニュー項目のスライドインアニメーション */
.menu-item {
  margin: 24px 0;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.menu-overlay.active .menu-item {
  opacity: 1;
  transform: translateY(0);
}

/* 時間差で順番に表示 */
.menu-overlay.active .menu-item:nth-child(1) { transition-delay: 0.1s; }
.menu-overlay.active .menu-item:nth-child(2) { transition-delay: 0.2s; }
.menu-overlay.active .menu-item:nth-child(3) { transition-delay: 0.3s; }

.menu-link {
  color: #ffffff;
  text-decoration: none;
  font-size: 1.35rem;
  font-weight: bold;
  letter-spacing: 3px;
  padding: 10px 28px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: all 0.3s ease;
  display: inline-block;
}

.menu-link:hover {
  color: #ff4d4d;
  border-color: #ff2b2b;
  background: rgba(255, 0, 0, 0.1);
  box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
  transform: scale(1.05);
}

/* 下部薄いテキスト（Bank Gothic指定） */
.menu-footer-text {
  position: absolute;
  bottom: 30px;
  font-family: "Bank Gothic", "BankGothic", "Copperplate", "Cinzel", sans-serif;
  color: rgba(255, 255, 255, 0.22);
  font-size: 0.85rem;
  letter-spacing: 3px;
  text-transform: uppercase;
}

    </style>
</head>

<body>
  <!-- 右上ロゴ -->
  <!-- ロゴ（クリックでメニュー開閉） -->
<img src="logo.jpg" alt="Omori Lab. Logo" class="top-logo" onclick="toggleMenu()">

<!-- オーバーレイメニュー本体 -->
<div id="menu-overlay" class="menu-overlay">
  <div class="menu-close-btn" onclick="toggleMenu()">&times;</div>
  
  <ul class="menu-list">
    <li class="menu-item"><a href="concept.html" class="menu-link">CONCEPT</a></li>
    <li class="menu-item"><a href="cast.html" class="menu-link">CASTS</a></li>
    <li class="menu-item"><a href="photogallery.html" target="_blank" class="menu-link">PHOTO GALLERY</a></li>
  </ul>

  <div class="menu-footer-text">Omori Lab. est-2026</div>
</div>
    
    <div class="intro-box">**３年６組企画　Omori Lab.**<br>**奨励賞受賞！**<br>**ありがとうございました！**</div>
    <img src="p13.jpg" alt="奨励賞受賞！">

    <div style="border: 1px dashed #4a0d0d; border-radius: 8px; padding: 20px; text-align: center; margin: 30px 0;">

    <style>
  @keyframes neonGlow {
    0% {
      box-shadow: 0 0 5px #ff2b2b, 0 0 10px #ff2b2b, inset 0 0 5px #ff2b2b;
      border-color: #ff2b2b;
    }
    50% {
      box-shadow: 0 0 15px #ff0000, 0 0 25px #ff0000, 0 0 35px #990000, inset 0 0 10px #ff0000;
      border-color: #ff6666;
    }
    100% {
      box-shadow: 0 0 5px #ff2b2b, 0 0 10px #ff2b2b, inset 0 0 5px #ff2b2b;
      border-color: #ff2b2b;
    }
  }

  .rich-glowing-btn {
    display: inline-block;
    background: linear-gradient(180deg, #b30000 0%, #4a0000 100%);
    color: #ffffff !important;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1.15rem;
    letter-spacing: 1px;
    border: 2px solid #ff2b2b;
    
    /* アニメーションの適用：2秒周期で無限にジワジワ光る */
    animation: neonGlow 2s infinite ease-in-out;
    transition: all 0.3s ease;
  }

  /* ホバー時（カーソルを乗せたとき）の強烈な発光＆ホバー効果 */
  .rich-glowing-btn:hover {
    transform: translateY(-3px) scale(1.03);
    background: linear-gradient(180deg, #e60000 0%, #660000 100%);
    box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff3333 !important;
    color: #ffffff !important;
  }
</style>

<div style="border: 1px dashed #551111; border-radius: 8px; padding: 24px; text-align: center; margin: 30px 0; background-color: rgba(15, 5, 5, 0.6);">
  
  <p style="color: #cccccc; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.6;">
    謎解きの問題・答えをご覧ください！
  </p>

  <a href="2.jpg" class="rich-glowing-btn">
    【 正解・解説はこちら 】
  </a>

</div>
  
      
　　<div class="concept-section">
        <p class="concept-text">２日間にわたり、たくさんのご来場、ありがとうございました。最後に、大森ラボの全研究員をご紹介いたします。</p>
        <a href="cast.html" target="_blank" class="btn-concept">【研究員一覧】</a>
　　</div>
    
<script>
  function toggleMenu() {
    const overlay = document.getElementById('menu-overlay');
    overlay.classList.toggle('active');
  }
</script>

</body>
</html>
