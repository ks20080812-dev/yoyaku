<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omori Lab. - 謎解き解答公開</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #d0d0d0;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiYo, sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    /* トップのアナウンスカード */
    .hero-card {
      background-color: #120707;
      border: 1px solid #4a0d0d;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 36px;
    }
    .hero-title {
      color: #ff2b2b;
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .hero-text {
      color: #cccccc;
      margin: 0;
    }
    /* 問題カード */
    .question-card {
      background-color: #0d0d0d;
      border: 1px solid #330a0a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 28px;
    }
    .question-header {
      color: #ff2b2b;
      font-size: 1.25rem;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid #4a0d0d;
      padding-bottom: 8px;
    }
    .quiz-image {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #333333;
      display: block;
      margin: 16px 0;
    }
    .answer-box {
      background-color: #1a0808;
      border-left: 4px solid #ff2b2b;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 6px 6px 0;
    }
    .answer-label {
      color: #ff2b2b;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .answer-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
    }
    .explanation-title {
      color: #ff2b2b;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .explanation-text {
      color: #bbbbbb;
      margin: 0;
    }
    /* 戻るボタン */
    .back-nav {
      margin-top: 40px;
      text-align: center;
    }
    .back-btn {
      display: inline-block;
      background: linear-gradient(180deg, #990000 0%, #550000 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: bold;
      border: 1px solid #ff2b2b;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- アナウンスエリア -->
    <div class="hero-card">
      <div class="hero-title">謎解き解答公開</div>
      <p class="hero-text">
        こちらに、２日間の謎解きの問題と正解を公開します。ぜひご覧ください。
      </p>
    </div>

    <!-- 1問目 -->
    <div class="question-card">
      <div class="question-header">【１問目】正答率 85％</div>
      <img src="q1.jpg" alt="1問目の問題画像" class="quiz-image">
      <div class="answer-box">
        <div class="answer-label">正解</div>
        <div class="answer-text">◯◯◯◯</div>
      </div>
      <div class="explanation-title">考え方・解説</div>
      <p class="explanation-text">
        ここには1問目の考え方や詳しい解説文を記載します。
      </p>
    </div>

    <!-- 2問目 -->
    <div class="question-card">
      <div class="question-header">【２問目】正答率 60％</div>
      <img src="q2.jpg" alt="2問目の問題画像" class="quiz-image">
      <div class="answer-box">
        <div class="answer-label">正解</div>
        <div class="answer-text">◯◯◯◯</div>
      </div>
      <div class="explanation-title">考え方・解説</div>
      <p class="explanation-text">
        ここには2問目の考え方や詳しい解説文を記載します。
      </p>
    </div>

    <!-- 3問目 -->
    <div class="question-card">
      <div class="question-header">【３問目】正答率 40％</div>
      <img src="q3.jpg" alt="3問目の問題画像" class="quiz-image">
      <div class="answer-box">
        <div class="answer-label">正解</div>
        <div class="answer-text">◯◯◯◯</div>
      </div>
      <div class="explanation-title">考え方・解説</div>
      <p class="explanation-text">
        ここには3問目の考え方や詳しい解説文を記載します。
      </p>
    </div>

    <!-- 4問目 -->
    <div class="question-card">
      <div class="question-header">【４問目】正答率 15％</div>
      <img src="q4.jpg" alt="4問目の問題画像" class="quiz-image">
      <div class="answer-box">
        <div class="answer-label">正解</div>
        <div class="answer-text">◯◯◯◯</div>
      </div>
      <div class="explanation-title">考え方・解説</div>
      <p class="explanation-text">
        ここには4問目の考え方や詳しい解説文を記載します。
      </p>
    </div>

    <!-- index.htmlに戻るリンク -->
    <div class="back-nav">
      <a href="index.html" class="back-btn">トップページに戻る</a>
    </div>

  </div>
</body>
</html>
